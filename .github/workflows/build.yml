Name: Build APK



on:

push:

branches: [ "**" ]

workflow_dispatch:



jobs:

build:

runs-on: ubuntu-latest

steps:

uses: actions/checkout@v4
uses: actions/setup-java@v4
with:

distribution: temurin

java-version: 17

uses: gradle/actions/setup-gradle@v4
with:

gradle-version: 8.9

name: Locate project
id: proj

run: |

find . -maxdepth 4 -not -path './.git/*' | sort | head -80

F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)

if [ -z "$F" ]; then

echo "::error::settings.gradle.kts bulunamadi"

exit 1

fi

echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

name: Build debug APK
working-directory: ${{ steps.proj.outputs.dir }}

run: gradle assembleDebug --no-daemon --stacktrace

uses: actions/upload-artifact@v4
with:

name: UdpRelay-apk

path: "**/app-debug.apk"

if-no-files-found: error

